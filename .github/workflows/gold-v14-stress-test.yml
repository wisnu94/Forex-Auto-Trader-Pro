name: Gold V14 Stress Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance python-dotenv

      - name: Run V14 Stress Test
        env:
          ROBUSTNESS_BARS: "4608"
          ROBUSTNESS_SYMBOL: "XAUUSD"
          MC_RUNS: "5000"
          MC_SEED: "1401"
        run: |
          python gold_v14_stress_test.py

      - name: Upload stress results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v14-stress-results
          path: |
            gold_v14_cost_stress.csv
            gold_v14_monte_carlo.csv
          if-no-files-found: ignore
