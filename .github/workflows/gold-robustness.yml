name: Gold Robustness

on:
  workflow_dispatch:

jobs:
  gold-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance python-dotenv

      - name: Run Gold Robustness Audit
        env:
          ROBUSTNESS_BARS: "3000"
          ROBUSTNESS_SYMBOL: "XAUUSD"
        run: |
          python gold_robustness_audit.py

      - name: Upload robustness results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-robustness-results
          path: |
            gold_robustness_trades.csv
            gold_parameter_stability.csv
          if-no-files-found: ignore