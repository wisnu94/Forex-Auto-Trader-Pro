name: Gold V15 Robustness V3

on:
  workflow_dispatch:
  push:
    paths:
      - "gold_v15_robustness_v3.py"
      - "backtest.py"
      - "strategy.py"
      - "mtf.py"
      - "data.py"
      - "config.py"
      - ".github/workflows/gold-v15-robustness-v3.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      ROBUSTNESS_BARS: "4608"
      ROBUSTNESS_SYMBOL: "XAUUSD"
      AUDIT_COST_R: "0.10"
      BOOTSTRAP_RUNS: "5000"
      AUDIT_TIMEOUT_SECONDS: "540"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V15 Robustness V3
        run: python gold_v15_robustness_v3.py

      - name: Upload V3 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v15-robustness-v3-results
          path: |
            gold_v15_v3_candidates.csv
            gold_v15_v3_windows.csv
            gold_v15_v3_holdouts.csv
          if-no-files-found: ignore
