name: Forex Auto Trader Pro - Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      # ======================================================
      # VERIFY DEPENDENCIES
      # ======================================================

      - name: Verify dependencies
        run: |
          python -c "import pandas; print('pandas OK')"
          python -c "import numpy; print('numpy OK')"
          python -c "import yfinance; print('yfinance OK')"
          python -c "import dotenv; print('python-dotenv OK')"

      # ======================================================
      # COMPILE CHECK
      # ======================================================

      - name: Compile Python files
        run: |
          python -m compileall -q .

      # ======================================================
      # IMPORT CHECK
      # ======================================================

      - name: Import core modules
        run: |
          python -c "import config"
          python -c "import strategy"
          python -c "import risk"
          python -c "import journal"
          python -c "import mtf"
          python -c "import backtest"

      # ======================================================
      # BASIC STRATEGY TEST
      # ======================================================

      - name: Strategy smoke test
        run: |
          python - <<'PY'
          import pandas as pd
          import numpy as np

          from strategy import generate_signal

          rows = 150

          close = np.linspace(
              1.0800,
              1.1200,
              rows
          )

          df = pd.DataFrame({
              "open": close,
              "high": close + 0.0010,
              "low": close - 0.0010,
              "close": close,
              "tick_volume": np.ones(rows) * 1000,
              "spread": np.zeros(rows),
              "real_volume": np.zeros(rows),
          })

          result = generate_signal(
              df,
              ema_fast=20,
              ema_slow=50,
              atr_period=14
          )

          assert "signal" in result

          assert result["signal"] in {
              "BUY",
              "SELL",
              "HOLD"
          }

          print("Strategy smoke test: PASS")
          print(result)
          PY

      # ======================================================
      # MTF ENGINE TEST
      # ======================================================

      - name: MTF engine test
        run: |
          python - <<'PY'
          import pandas as pd
          import numpy as np
          import mtf

          rows = 150

          close = np.linspace(
              1.0800,
              1.1200,
              rows
          )

          df = pd.DataFrame({
              "open": close,
              "high": close + 0.0010,
              "low": close - 0.0010,
              "close": close,
              "tick_volume": np.ones(rows) * 1000,
              "spread": np.zeros(rows),
              "real_volume": np.zeros(rows),
          })

          trend = mtf.timeframe_trend(
              df,
              fast_period=20,
              slow_period=50
          )

          assert trend == "BUY"

          print("MTF trend detection: PASS")

          trends = {
              "H4": "BUY",
              "H1": "BUY",
              "M15": "BUY",
          }

          score = mtf.calculate_mtf_score(
              trends
          )

          assert score == 100

          print("MTF score test: PASS")
          print("Score:", score)

          confirmation = {
              "trends": trends,
              "score": score,
              "status": "STRONG_BUY",
          }

          assert mtf.mtf_allows_signal(
              "BUY",
              confirmation
          )

          assert not mtf.mtf_allows_signal(
              "SELL",
              confirmation
          )

          print("MTF signal filter: PASS")
          print()
          print("MTF ENGINE TEST: PASS")
          PY

      # ======================================================
      # RISK ENGINE TEST
      # ======================================================

      - name: Risk engine test
        run: |
          python - <<'PY'
          from risk import (
              calculate_sl_tp,
              calculate_position_size_mt5
          )

          levels = calculate_sl_tp(
              signal="BUY",
              entry_price=1.1000,
              atr_value=0.0010,
              atr_multiplier=1.5,
              reward_risk=2.0
          )

          assert levels is not None
          assert levels["sl"] < levels["entry"]
          assert levels["tp"] > levels["entry"]

          volume = calculate_position_size_mt5(
              equity=10000,
              risk_percent=0.005,
              entry_price=1.1000,
              stop_loss=1.0985,
              tick_size=0.00001,
              tick_value=1.0,
              volume_min=0.01,
              volume_max=100.0,
              volume_step=0.01
          )

          assert volume >= 0

          print("Risk engine test: PASS")
          print("SL:", levels["sl"])
          print("TP:", levels["tp"])
          print("Volume:", volume)
          PY

      # ======================================================
      # REAL-DATA BACKTEST
      # ======================================================

      - name: Run real-data backtest
        run: |
          python run_backtest.py