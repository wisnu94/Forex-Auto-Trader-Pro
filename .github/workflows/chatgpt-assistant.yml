name: ChatGPT Assistant (changelog & lint suggestions)

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  chatgpt-assistant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug: list .github directory
        run: |
          echo "PWD: $(pwd)"
          echo "Listing .github directory:"
          ls -la .github || true
          echo "Listing .github/scripts directory:"
          ls -la .github/scripts || true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir openai flake8 requests

      - name: Run ChatGPT assistant
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          if [ ! -f .github/scripts/chatgpt_assistant.py ]; then
            echo ".github/scripts/chatgpt_assistant.py not found! Exiting."
            exit 2
          fi
          python .github/scripts/chatgpt_assistant.py