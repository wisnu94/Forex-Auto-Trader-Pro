name: Gold V15 Long Only Robustness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gold_v15_long_only_robustness.py'
      - '.github/workflows/gold-v15-long-only-robustness.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ROBUSTNESS_BARS: '4608'
      ROBUSTNESS_SYMBOL: 'XAUUSD'
      AUDIT_COST_R: '0.10'
      BOOTSTRAP_RUNS: '2000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python gold_v15_long_only_robustness.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-v15-long-only-robustness
          path: gold_v15_long_only_full.csv
          if-no-files-found: ignore
