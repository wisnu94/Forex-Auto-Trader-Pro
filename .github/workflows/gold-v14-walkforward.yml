name: Gold V14 Walk Forward

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  walk-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance python-dotenv

      - name: Run V14 walk-forward audit
        env:
          ROBUSTNESS_BARS: "4608"
          ROBUSTNESS_SYMBOL: "XAUUSD"
          AUDIT_COST_R: "0.10"
        run: |
          python gold_v14_walkforward.py

      - name: Upload walk-forward results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v14-walkforward-results
          path: gold_v14_walkforward.csv
          if-no-files-found: ignore