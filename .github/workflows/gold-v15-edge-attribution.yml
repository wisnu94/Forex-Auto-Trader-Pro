name: Gold V15 Edge Attribution
on:
  workflow_dispatch:
  push:
    paths:
      - 'gold_v15_edge_attribution.py'
      - '.github/workflows/gold-v15-edge-attribution.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ROBUSTNESS_BARS: '4608'
      ROBUSTNESS_SYMBOL: 'XAUUSD'
      AUDIT_COST_R: '0.10'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run edge attribution
        run: python gold_v15_edge_attribution.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v15-edge-attribution
          path: |
            gold_v15_edge_attribution.csv
            gold_v15_edge_trades.csv
          if-no-files-found: ignore
